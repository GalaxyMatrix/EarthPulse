services:
  db:
    image: postgis/postgis:16-3.4
    container_name: earthpulse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: earthpulse
      POSTGRES_PASSWORD: earthpulse
      POSTGRES_DB: earthpulse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U earthpulse -d earthpulse"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: